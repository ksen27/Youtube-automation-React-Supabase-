# fly.toml app configuration file generated for video-automation-worker on 2026-05-07T20:27:07+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'video-automation-worker'
primary_region = 'lhr'

# Non-secret pipeline tuning, version-controlled here so the deployed worker
# uses the intended value instead of silently falling back to the code default
# in lib/env.ts. (.env.local is git-ignored AND excluded by .dockerignore, so
# it never reaches the Fly image — only Fly secrets and this [env] block
# populate the worker's process.env.)
#
# IMPORTANT: Fly SECRETS override [env]. The other pipeline tunings
# (WORKER_CONCURRENCY, CLIP_PIPELINE_CONCURRENCY, FFMPEG_THREADS,
# FFMPEG_TIMEOUT_SECONDS, DOWNLOAD_CONCURRENCY, RENDER_PIPELINE_CONCURRENCY,
# NICE_LEVEL) are already set as Fly secrets, so they are intentionally NOT
# listed here — putting them in both places would be confusing and the secret
# would win anyway. Only MAX_SOURCE_DURATION_SECONDS lives here because it was
# never set as a secret and was the one value diverging from the default (the
# 25-min limit that rejected sub-40-min sources as "source_too_long").
[env]
  # This app serves ONLY the celebrity (sourced) queues. The AI-avatar
  # (synthetic) queues run on the separate video-automation-avatar-worker app
  # (see fly.avatar.toml) so a heavy render never starves avatar generation and
  # vice versa. Set to 'all' to fold both engines back into this one worker.
  WORKER_ROLE = "sourced"
  MAX_SOURCE_DURATION_SECONDS = "2400"
  # Resume cache for renders. MUST live on the persistent /data volume (see
  # [[mounts]] below) so per-clip outputs survive a machine reboot/redeploy and
  # an interrupted render resumes instead of re-encoding all ~400 clips. The
  # code default (./tmp/render-cache) is ephemeral and only suitable for dev.
  RENDER_CACHE_DIR = "/data/render-cache"

[build]
  dockerfile = 'Dockerfile.worker'

# Render throughput is CPU-bound: every footage clip is a libx264 normalize
# pass and every image/video boundary is an xfade re-encode. The clip-normalize
# loop runs RENDER_PIPELINE_CONCURRENCY lanes in parallel, so more vCPUs let
# more clips encode at once. Bumped 4x -> 8x (4 -> 8 dedicated vCPUs) to roughly
# halve the clip-loop wall-time on big (~400-clip) projects.
#
# IMPORTANT: the concurrency knobs that consume these cores are Fly SECRETS
# (they override [env] here), so changing the VM size alone is NOT enough. To
# actually use the 8 cores, set:
#   fly secrets set RENDER_PIPELINE_CONCURRENCY=4 FFMPEG_THREADS=2 \
#     --app video-automation-worker
# (4 lanes x 2 threads = 8 vCPUs — the rule of thumb from lib/env.ts.)
[[vm]]
  size = 'performance-8x'
  memory = '16gb'

# Redis AOF lives here so queue state survives container restarts/deploys.
# Without this, every redeploy would wipe in-flight jobs.
[[mounts]]
  source = 'worker_data'
  destination = '/data'

# Expose the in-container Redis to the public internet so the Next.js app
# on Vercel can enqueue jobs. Password-protected via REDIS_PASSWORD secret.
# auto_stop/auto_start are off — the worker must stay up to keep Redis up.
[[services]]
  internal_port = 6379
  protocol = 'tcp'
  auto_stop_machines = false
  auto_start_machines = false

  [[services.ports]]
    port = 6379
