# Fly config for the EBOOK worker — a THIRD app, alongside the celebrity worker
# (fly.toml) and the AI-avatar worker (fly.avatar.toml). Deploy with:
#   fly deploy -c fly.ebook.toml
#
# Why a third app: the ebook pipeline is 18 queues of mostly LLM-bound work, but
# two of its stages are genuinely heavy — `whisper-transcribe` (yt-dlp audio
# download + Whisper) and `export` (Puppeteer/Chromium rendering a ~100-page PDF).
# Folding those onto the celebrity or avatar machine would put a book's PDF
# render in direct contention with a video encode for CPU and RAM. It also keeps
# the blast radius small: this app needs ANTHROPIC_API_KEY, and a missing/expired
# one must never take a video worker down.
#
# It hosts NO Redis of its own — it connects to the celebrity worker's Redis,
# which is where all three engines' queues live. Its queues are namespaced
# `video-automation-ebook-*` (see redisQueueName() in
# packages/ebook-infra/queue/queues.ts) so they can never collide with the video
# queues sharing that instance.
#
# REQUIRED secrets (set once):
#   fly secrets set -c fly.ebook.toml \
#     REDIS_URL='redis://:<password>@video-automation-worker.fly.dev:6379' \
#     NEXT_PUBLIC_SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... \
#     ANTHROPIC_API_KEY=... YOUTUBE_API_KEY=... \
#     SIXTYNINE_LABS_API_KEY=... \
#     SECRET_BOX_KEY=...
# (REDIS_URL must point at the celebrity worker's public Redis — the shared queue.)
#
# SECRET_BOX_KEY is what decrypts the stored Payhip browser session
# (ebook.payhip_sessions, migration 0034) so the `checkout-product` queue can
# list a finished book for sale. It must be the SAME value the web app and the
# `payhip:connect` CLI use — the session is encrypted with it, so a different
# key here does not fail loudly at boot, it fails on the first listing with a
# decryption error. Without it that queue cannot run at all; every other queue
# is unaffected.
#
# The Payhip automation needs no other configuration: PAYHIP_* all have working
# defaults (see packages/ebook-config/env.ts), and there are deliberately no
# Payhip credentials anywhere — a human connects the session once with
# `npm run payhip:connect` and every worker reuses it.
#
# OPTIONAL secrets:
#   OPENAI_API_KEY      — cover art (gpt-image-1) AND the Whisper transcript
#                         fallback. Without it, books have no cover image and any
#                         video lacking captions is skipped rather than
#                         transcribed.
#   NETLIFY_AUTH_TOKEN  — publishing generated sales pages. Without it a page can
#                         still be generated and previewed, just not published.
#   NETLIFY_ACCOUNT_SLUG — only when the token has access to more than one team.
#
#   YT_DLP_COOKIES_B64  — base64 of a Netscape cookies.txt for a signed-in
#                         YouTube account, materialized to a private temp file
#                         at startup (see ytdlpCookies.ts). Without it, gated
#                         videos fail the Whisper fallback with "Sign in to
#                         confirm you're not a bot" NO MATTER how clean the
#                         proxy IP is — the gate is on the player request, not
#                         the page fetch, and a residential proxy that loads the
#                         watch page fine still gets refused a format. Set with:
#                           echo "YT_DLP_COOKIES_B64=$(base64 -w0 cookies.txt)" \
#                             | fly secrets import -c fly.ebook.toml
#                         (`secrets import` reads KEY=VALUE from stdin; a plain
#                         `secrets set` would put the whole jar in shell history.)
#                         Export the jar from an INCOGNITO window and close it
#                         right after — YouTube rotates session cookies as you
#                         browse, which invalidates a jar exported from a window
#                         you keep using.
#                         Cookies expire; a recurrence of the bot gate on ALL
#                         videos at once means re-export, not a proxy purchase.
#
#   YT_DLP_POT_SCRIPT / YT_DLP_POT_BASE_URL
#                       — a PO token provider (bgutil), in script or server mode.
#                         A PO token is the proof-of-browser YouTube's own client
#                         attaches, and it is the ONLY credential here that
#                         neither expires nor belongs to a Google account — the
#                         answer when the cookie jar keeps going stale. Unset =
#                         no token, which is what the pipeline has always done.
#   YT_DLP_EXTRACTOR_ARGS
#                       — raw --extractor-args, semicolon-separated, for a future
#                         YouTube change that needs a client switch (e.g.
#                         "youtube:player_client=default,tv_simply") without
#                         shipping code.
#   YT_DLP_NO_SELF_UPDATE=1
#                       — pin a machine to the yt-dlp baked into the image. By
#                         default every boot runs `yt-dlp -U` (Dockerfile.worker)
#                         so a restart heals a stale extractor; set this only when
#                         a fresh yt-dlp release is itself the regression.
#
#   YT_DLP_PROXIES      — the residential proxy pool, `host:port:user:pass`
#                         comma-separated. Verify every entry BEFORE setting it:
#                         a proxy that 407s is quarantined for 10 minutes and
#                         silently shrinks the pool, and a wholly-bad list stops
#                         the stage outright. Check one with:
#                           curl -x http://user:pass@host:port https://ipinfo.io/json
#                         Also note the spelling — this app ALSO reads
#                         YTDLP_PROXIES (no underscore), and YT_DLP_PROXIES wins
#                         when both are set. See youtubeProxyList().
#
# BEFORE THE FIRST DEPLOY, the ebook schema must exist:
#   1. Run supabase/migrations/0031_ebook_schema.sql, then 0032_..., in the
#      Supabase SQL editor. They MUST run as two separate statement batches —
#      0032 references enum values 0031 adds, and Postgres rejects that in one
#      transaction ("unsafe use of new value of enum type").
#   2. Supabase → Settings → API → Exposed schemas → add `ebook`.
#      PostgREST returns PGRST106 on every query until this is done.

app = 'video-automation-ebook-worker'
primary_region = 'lhr'

# Graceful-shutdown window. On deploy / `secrets set`, Fly sends SIGTERM and the
# worker's shutdown() drains via worker.close(), letting in-flight jobs finish.
# The longest single ebook job is a chapter generation (one Claude call, a few
# minutes) or a PDF export; 300s covers both. Fly HARD-CAPS this at 5 minutes —
# 600s is rejected at deploy ("cannot exceed 5 minutes"), which is why the avatar
# worker also sits at 300s.
#
# A job killed mid-flight is NOT lost: every stage runs behind the idempotency
# ledger (job_runs), so BullMQ's stalled-job recovery re-delivers it and the
# guard makes the re-run a no-op if it had already completed.
kill_timeout = "300s"

[env]
  # Serve ONLY the ebook queues. The video engines run on the other two apps.
  WORKER_ROLE = "ebook"

  # Full upstream concurrency. The default is 0.25 (~36 concurrent jobs), sized
  # for an ebook worker SHARING a machine with the video engines; this app is
  # dedicated, so it runs the table as tuned (~135). See queueRuntimeConfig() in
  # packages/ebook-infra/queue/queues.ts.
  #
  # NOTE: that total is deliberately much higher than the vCPU count — nearly
  # every one of those slots is blocked on a Claude HTTP call, not burning CPU.
  # The real ceiling is the Anthropic tier limit, enforced per-queue by the
  # BullMQ limiters in QUEUE_CONFIG, not by this number.
  EBOOK_CONCURRENCY_SCALE = "1"

  # Puppeteer's bundled Chromium, installed to this path in Dockerfile.worker.
  # Without it puppeteer.launch() looks in ~/.cache/puppeteer, which does not
  # exist in the image, and every PDF export fails with "Could not find Chrome".
  PUPPETEER_CACHE_DIR = "/root/.cache/puppeteer"

  # Illustration spend control. gpt-image-1 bills roughly an order of magnitude
  # more per image at "high" than at "low", and leaving the field unset bills at
  # the model default rather than the cheap end. Client direction 2026-08-24 is
  # the lowest quality, and for ILLUSTRATIONS that is right: a book can burn
  # dozens of them, they sit inside chapters at modest size, and this is only the
  # fallback for when 69labs fails.
  OPENAI_IMAGE_QUALITY = "low"

  # The COVER is the other half of that trade, and used to share the setting
  # above. It must not.
  #
  # Every word of the cover — title, deck, subtitle — is drawn BY the image
  # model; there is no HTML overlay any more (see export/html.ts). Small text is
  # the first thing "low" destroys. Measured on one book, same prompt and inputs
  # each time: three generations at "low" produced a garbled deck and an invented
  # paragraph of noise, and the same call at "high" rendered every line correctly.
  #
  # The old justification here — "the cover is composited under HTML-typeset
  # title text, so the extra fidelity buys nothing" — was true when it was
  # written and stopped being true when the text moved into the artwork. The
  # setting outlived its reason.
  #
  # One image per book, against a hundred pages of Claude: the cost difference is
  # noise next to an unsellable cover. Drop to "medium" if that ever stops being
  # true — but check a real cover's small text before going back to "low".
  OPENAI_COVER_QUALITY = "high"

  # Deno, installed to this path in Dockerfile.worker. yt-dlp uses it to solve
  # YouTube's player challenge; WITHOUT a JS runtime YouTube rejects every
  # request as a bot ("Sign in to confirm you're not a bot") regardless of how
  # clean the source IP is — residential proxies alone do NOT fix it. Passed
  # explicitly as `--js-runtimes deno:<path>` rather than relying on PATH.
  YT_DLP_DENO_PATH = "/usr/local/bin/deno"

  # Local scratch for yt-dlp audio downloads (Whisper fallback) and export
  # artifacts before they are uploaded. Ephemeral is correct here: nothing on
  # this path needs to survive a restart — see the no-[[mounts]] note below.
  TMP_DIR = "/tmp/work"

[build]
  dockerfile = 'Dockerfile.worker'

# Sizing. The work splits in two:
#   * LLM-bound (most of the 18 queues) — near-zero CPU, just many concurrent
#     open sockets waiting on Claude. Wants RAM for the in-flight book state,
#     not cores.
#   * Chromium-bound (`export`) — a ~100-page PDF render is a real memory spike,
#     and the avatar worker's history is instructive: 4gb SIGTERM-killed Chromium
#     after roughly one render.
# shared-cpu-4x / 8gb covers both without paying for the performance-8x the video
# encoders need — there is no libx264 work on this machine. Raise memory first if
# exports OOM; raise cores only if profiling actually shows CPU saturation.
[[vm]]
  size = 'shared-cpu-4x'
  memory = '8gb'

# NO [[mounts]]. Unlike the two video workers, nothing here needs a persistent
# volume: the render-cache they protect is a video-render concept, exports are
# uploaded to storage as they finish, and audio downloads are transient. Job
# durability lives in Redis (on the celebrity worker's volume) plus the job_runs
# ledger in Postgres, so an interrupted book resumes from its last completed
# stage regardless of this machine's disk.

# NO [[services]]. This worker exposes no port and hosts no Redis — it is a pure
# BullMQ consumer of the celebrity worker's instance.
#
# Consequence for cost: with no inbound service, Fly cannot auto-WAKE this app
# from a queued Redis job (auto_start fires on inbound HTTP, which this app has
# none of). Same trade-off as the avatar worker. Books are submitted in bursts,
# so if idle cost matters:
#   fly scale count 1 -c fly.ebook.toml   # before submitting books
#   fly scale count 0 -c fly.ebook.toml   # when the queue is drained
# Leaving one shared-cpu-4x machine always-on is the simpler default.

# ── ON-DEMAND START/STOP (cost control) ──────────────────────────────────────
# This machine no longer needs to run 24/7. lib/jobs/queue.ts starts it from the
# enqueue path (and FAILS the request if it cannot, rather than parking a job
# with no consumer), and lib/fly/idle-monitor.ts on the always-on celebrity
# worker stops it once both Redis and Postgres show no live work for
# FLY_IDLE_CHECKS_BEFORE_STOP consecutive checks (default 30 min).
#
# Uses `machine start/stop`, NOT `scale count 0/1`: scaling destroys the machine
# and drops its volume, and this app's volume holds the render resume cache.
#
# REQUIRED SECRETS on the CELEBRITY worker (video-automation-worker) and in
# Vercel — the two places that enqueue and monitor. Not needed here:
#   fly secrets set FLY_API_TOKEN=<fly tokens create deploy> #     FLY_AVATAR_APP_NAME=video-automation-avatar-worker #     FLY_EBOOK_APP_NAME=video-automation-ebook-worker #     --app video-automation-worker
# Until BOTH the token and the app name are set, everything below is INERT and
# the machine stays up exactly as before — a missing secret must never turn
# into a silently-hanging generate.
