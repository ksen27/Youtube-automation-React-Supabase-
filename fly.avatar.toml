# Fly config for the AI-AVATAR (synthetic) worker — a SEPARATE app from the
# celebrity worker (fly.toml). Deploy with:
#   fly deploy -c fly.avatar.toml
#
# Why a second app: avatar generation is bursty (occasional), and the work is
# heavy per-job (Playwright/Chromium for HeyGen). Isolating it onto its own
# machine means a big celebrity render can never starve it of CPU/RAM, and vice
# versa. It connects to the EXISTING Redis hosted by the celebrity worker, so it
# hosts no service of its own and can scale to zero when idle.
#
# REQUIRED secrets (set once, mirroring the celebrity worker where shared):
#   fly secrets set -c fly.avatar.toml \
#     REDIS_URL='redis://:<password>@video-automation-worker.fly.dev:6379' \
#     NEXT_PUBLIC_SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... \
#     R2_ACCOUNT_ID=... R2_ACCESS_KEY_ID=... R2_SECRET_ACCESS_KEY=... R2_PUBLIC_BASE_URL=... \
#     DEEPGRAM_API_KEY=... GEMINI_API_KEY=... \
#     SIXTYNINE_LABS_API_KEY=... FAL_AI_API_KEY=... \
#     SECRET_BOX_KEY=... HEYGEN_PROXIES=...
# (REDIS_URL must point at the celebrity worker's public Redis — that's the
#  shared queue both engines use.)
#
# OPTIONAL secret — backup 69labs image key (failover only):
#   fly secrets set -c fly.avatar.toml SIXTYNINE_LABS_API_KEY_BACKUP=...
# Used ONLY for image generation, and ONLY when the primary 69labs key returns a
# permanent auth 403 ("Access denied" / FORBIDDEN — a revoked/blocked/expired
# key). The image submit then retries once on this backup key instead of failing
# the segment. The two keys are used one-at-a-time (never concurrently), so the
# SIXTYNINE_IMAGE_CONCURRENCY cap still protects each key's tier limit. Omit to
# keep single-key behavior. Like all keys it is a SECRET — do NOT put it in [env].

app = 'video-automation-avatar-worker'
primary_region = 'lhr'

[env]
  # Serve ONLY the synthetic queues (tts/planner/image/video/avatar).
  WORKER_ROLE = "synthetic"
  # Headless Chromium for HeyGen automation.
  HEYGEN_HEADLESS = "true"
  # How long the warm HeyGen session is trusted before the worker re-verifies it
  # by loading /home. That /home hit is a fresh Cloudflare challenge, and in a
  # long unbroken batch (20-30 avatar videos) the default 20-min re-verify fired
  # mid-batch (~video 10-15), failed the challenge, and logged the account out —
  # forcing a manual `npm run heygen:connect`. Set very high (~7 days) so the
  # re-verify never fires DURING a batch; the renders themselves prove the session
  # is alive and cookies are re-saved after each render, so the /home check adds no
  # safety it doesn't already have. NOTE: this only removes the worker-triggered
  # logout — Cloudflare/HeyGen can still revoke a session on their side, so rare
  # logouts remain possible (mitigate with multiple connected accounts).
  HEYGEN_REVERIFY_AFTER_MINUTES = "9999"
  # How long verifyAuthenticated waits for HeyGen's authed nav marker before
  # judging the session expired. Measured 2026-06-26: through the residential
  # proxy the authed marker renders at ~46s — right at the old 45s default, so a
  # still-VALID session timed out, was flagged needs_reauth, and emptied the
  # single-account pool ("no available accounts" on the very first job of a
  # batch). 90s sits comfortably above real proxy latency.
  HEYGEN_AUTH_MARKER_TIMEOUT_MS = "90000"
  # BACKSTOP cap on warm-browser reuse. Since the health-based recycling refactor
  # (lib/synthetic/heygen-health.ts) a browser that goes bad — blank composer /
  # Cloudflare wall, failure streak, crash, disconnect — is recycled by HEALTH
  # the moment it degrades, so this is no longer the primary trigger. It stays as
  # a PREEMPTIVE safety net: a healthy headless session still gets Cloudflare-
  # flagged after a number of renders and then walls every /avatar load (the
  # SESSION is flagged, not the page; a page-only rebuild can't recover it).
  # Recycling before that point keeps the happy path off the wall. Raised 2 -> 6
  # so healthy browsers stay warm longer (the speed win) while health catches any
  # that degrade earlier. Tune down if the wall is hit before health recycles; 0
  # disables the cap and relies on health alone.
  HEYGEN_MAX_RENDERS_PER_SESSION = "6"
  # Use patchright (stealth-patched Chromium) instead of vanilla Playwright.
  # Vanilla headless Chromium intermittently fails Cloudflare's bot challenge on
  # /home and /avatar (blank_composer in bursts, session + IP both healthy).
  # patchright removes the CDP/headless tells the hand-rolled init scripts can't.
  # Requires `npx patchright install chromium` in the image (see Dockerfile.worker).
  HEYGEN_USE_STEALTH = "true"
  # Per-step composer/upload selector budget. With stealth the /avatar composer
  # LOADS fine but paints in ~70-90s through the proxy — past the old 45s default
  # — so the scriptField wait timed out and threw a FALSE blank_composer on a page
  # that was actually rendered. 90s covers the real paint time.
  HEYGEN_SETUP_TIMEOUT_MS = "90000"
  # PARALLEL AVATAR GENERATION. How many avatar jobs render CONCURRENTLY, each on
  # a DISTINCT HeyGen account (claimed via an atomic DB lease — migration 0026 —
  # so two jobs never drive the same account's warm browser). Raising this is the
  # only lever for BATCH throughput: per-render is floored at HeyGen's ~1min
  # server render, so N accounts in parallel cut a batch to ~1/N the wall time.
  #
  # SAFETY PRECONDITIONS before raising above 1:
  #   1. HEYGEN_PROXIES must hold >= this many DISTINCT exit IPs — resolveProxy()
  #      maps each account to its own IP, so concurrent browsers egress from
  #      different IPs and don't look like one bot hammering Cloudflare. Too few
  #      IPs = two live accounts share an IP = the blank-composer wall.
  #   2. >= this many accounts must be 'active' (npm run heygen:status).
  # ROLLOUT: start at 2 (pilot), confirm on a real batch that logs show
  # heygen.session.reused, NO blank_composer, and no two jobs on the same
  # accountId, then raise to 3-4. Overridable by a Fly secret if you'd rather not
  # redeploy to tune it.
  #
  # CURRENT SETUP (2 accounts, 2 machines): this is PER MACHINE. We run 2 machines
  # (fly scale count 2) for parallel RENDERS, and we have exactly 2 HeyGen
  # accounts, each pinned to its own dedicated residential IP (the per-account
  # `proxy` column, not the pool). So "1" here × 2 machines = 2 concurrent avatars
  # = 2 accounts, one browser per machine per IP — no shared-IP Cloudflare signal
  # and no wasted slot fighting over a 3rd account that doesn't exist. Do NOT raise
  # above 1 until there are MORE than 2 accounts (each with its own clean IP): with
  # 2 accounts, 2 here would let one machine try to claim both and the other starve
  # on "no available accounts".
  AVATAR_CONCURRENCY = "1"
  # Per-job account lease length (seconds). Must exceed one avatar attempt's worst
  # case (HEYGEN_RENDER_TIMEOUT_MS 600s + setup); generateAvatar renews it before
  # each attempt. A crashed worker's account auto-frees after this. Default in
  # lib/env.ts is 900; set here only to override.
  # HEYGEN_ACCOUNT_LEASE_SECONDS = "900"
  # Clip/image mix (client 2026-07-20 via Joey: "30-70 for the first 15 minutes,
  # then all images for the last 10-15 minutes" — ai_clip cost reduction).
  # Zone 1 (0-15 min): 1 clip / 2 images repeating ≈ 33:67, the closest evenly
  # spaced run pattern to 30:70. Zone 2 (after 15 min): fraction 0 = every
  # visual is a still. split_2/avatar blocks are untouched by this pass.
  # Previous values: 180 / 2 / 2 / 0.25 (50:50 first 3 min, then 1-in-4 clips).
  SYNTHETIC_CLIP_HEAVY_SECONDS = "900"
  SYNTHETIC_INTRO_CLIP_RUN = "1"
  SYNTHETIC_INTRO_IMAGE_RUN = "2"
  SYNTHETIC_POST_INTRO_CLIP_FRACTION = "0"
  # Local scratch for downloads/screenshots (ephemeral is fine for HeyGen
  # automation artifacts).
  TMP_DIR = "/tmp/work"
  # This worker now ALSO serves the synthetic render queue, so it needs the
  # per-clip resume cache on a PERSISTENT volume (see [[mounts]] below) — exactly
  # like the celebrity worker. Without it an interrupted avatar render would
  # re-encode all ~300 clips from scratch on restart instead of resuming.
  RENDER_CACHE_DIR = "/data/render-cache"

[build]
  dockerfile = 'Dockerfile.worker'

# This worker does TWO kinds of work now: HeyGen/Playwright avatar generation
# (Chromium-bound) AND synthetic RENDER jobs (it serves the render queue — see
# RENDER_CACHE_DIR note above). Render is CPU-bound: every clip is a libx264
# normalize pass and every image/video boundary is an xfade re-encode, run in
# RENDER_PIPELINE_CONCURRENCY parallel lanes. shared-cpu-4x was too slow for that
# — shared cores get throttled under sustained 100% encode load, so avatar-engine
# renders ran far slower than the celebrity worker (performance-8x). Matched to
# the celebrity render VM so render throughput is the same on both engines.
#
# Chromium also needs the headroom: 4gb SIGTERM-killed the browser after ~1
# render (browser_disconnected -> "Reaped child process ... SIGTERM"); 16gb gives
# ample room for the HeyGen SPA plus several warm per-account browsers.
#
# IMPORTANT: the render concurrency knobs are Fly SECRETS (they override [env]),
# so the bigger VM alone does nothing until they are set to use the 8 cores —
# mirror the celebrity worker:
#   fly secrets set RENDER_PIPELINE_CONCURRENCY=4 FFMPEG_THREADS=2 \
#     --app video-automation-avatar-worker
# (4 lanes x 2 threads = 8 vCPUs — the rule of thumb from lib/env.ts.)
[[vm]]
  size = 'performance-8x'
  memory = '16gb'

# Persistent volume for the synthetic render resume cache (RENDER_CACHE_DIR =
# /data/render-cache). Mirrors the celebrity worker's worker_data mount so an
# interrupted avatar render resumes from its per-clip cache instead of
# re-encoding everything. Distinct volume NAME from the celebrity app's so the
# two apps never share storage. Create it once before first deploy:
#   fly volumes create avatar_worker_data --size 20 --region lhr -c fly.avatar.toml
[[mounts]]
  source = 'avatar_worker_data'
  destination = '/data'

# NOTE on auto-stop: a BullMQ worker has no inbound HTTP port, so Fly cannot
# auto-WAKE it from a queued Redis job (auto_start fires on inbound requests to
# a service, which this app doesn't expose). Two cost options:
#   (A) Leave this app scaled to a single always-on machine (simplest). Cost is
#       just the small shared-cpu-2x — far cheaper than a 2nd performance-8x.
#   (B) For true scale-to-zero, scale it to 0 between runs and start it on
#       demand right before generating:
#         fly scale count 1 -c fly.avatar.toml   # before a batch
#         fly scale count 0 -c fly.avatar.toml   # when done
#       (Or wire the generate-synthetic API route to call the Fly Machines API
#        to start the machine — a future enhancement.)
# No [[services]] block: this worker exposes nothing and hosts no Redis.
